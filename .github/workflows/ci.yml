name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  java-build:
    name: Java Build (no integration tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - discovery
          - gateway
          - services/user-service
          - services/problem-service
          - services/submission-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build module
        run: mvn -B -f ${{ matrix.module }}/pom.xml -DskipTests verify

  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install swagger-cli
        run: npm i -g @apidevtools/swagger-cli

      - name: Validate specs
        run: |
          swagger-cli validate docs/api-specs/problem-service.yaml
          swagger-cli validate docs/api-specs/submission-service.yaml
          swagger-cli validate docs/api-specs/user-service.yaml