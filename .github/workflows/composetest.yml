name: CI Docker Compose

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env <<EOF
          JWT_SECRET=test-secret
          DB_USER=postgres
          DB_PASSWORD=postgres
          USER_DB_NAME=user_db
          PROBLEM_DB_NAME=problem_db
          SUBMISSION_DB_NAME=submission_db
          MINIO_ROOT_USER=minio
          MINIO_ROOT_PASSWORD=minio123
          RABBITMQ_USER=guest
          RABBITMQ_PASS=guest
          EOF

      - name: Build images
        run: docker compose build --pull

      - name: Start stack
        run: docker compose up -d

      - name: Show containers
        run: docker compose ps

      # 👉 Wait for ports instead of immediately curl
      - name: Wait for services to be ready
        run: |
          set -e

          wait_for_port() {
            local port=$1
            for i in {1..30}; do
              if nc -z localhost "$port"; then
                echo "Port $port is ready"
                return 0
              fi
              echo "Waiting for port $port..."
              sleep 2
            done
            echo "Port $port not ready"
            return 1
          }

          wait_for_port 5000
          wait_for_port 5001
          wait_for_port 5002
          wait_for_port 5003
          wait_for_port 8080

      - name: Smoke test health endpoints
        run: |
          set -e

          test_endpoint() {
            local url=$1
            echo "Testing $url"

            for i in {1..20}; do
              if curl -fsS "$url" | grep -q '"status":"ok"'; then
                echo "OK: $url"
                return 0
              fi
              sleep 2
            done

            echo "FAILED: $url"
            return 1
          }

          test_endpoint http://localhost:5000/health
          test_endpoint http://localhost:5001/health
          test_endpoint http://localhost:5002/health
          test_endpoint http://localhost:5003/health
          test_endpoint http://localhost:8080/health

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Cleanup
        if: always()
        run: docker compose down -v
