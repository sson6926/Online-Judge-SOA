name: CI Docker Compose

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cat > .env <<'EOF'
          JWT_SECRET=test-secret
          DB_USER=postgres
          DB_PASSWORD=postgres
          USER_DB_NAME=user_db
          PROBLEM_DB_NAME=problem_db
          SUBMISSION_DB_NAME=submission_db
          MINIO_ROOT_USER=minio
          MINIO_ROOT_PASSWORD=minio123
          RABBITMQ_USER=guest
          RABBITMQ_PASS=guest
          EOF

      - name: Build all images (fresh base tags)
        run: docker compose build --pull

      - name: Start stack
        run: docker compose up -d

      - name: Show running containers (debug)
        run: docker compose ps

      - name: Wait and smoke check health endpoints
        run: |
          set -e
          # retry helper
          retry() {
            local url="$1"
            for i in {1..30}; do
              if curl -fsS "$url" | grep -q '"status":"ok"\|"status": "ok"'; then
                echo "OK $url"
                return 0
              fi
              sleep 3
            done
            echo "FAILED $url"
            return 1
          }

          retry http://localhost:5000/health
          retry http://localhost:5001/health
          retry http://localhost:5002/health
          retry http://localhost:5003/health
          retry http://localhost:8080/health

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose down -v