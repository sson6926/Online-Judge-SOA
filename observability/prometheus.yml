global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8000']

  - job_name: problem-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['problem-service:5001']

  - job_name: submission-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['submission-service:5002']

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:5000']

  - job_name: judge-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['judge-service:5003']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
