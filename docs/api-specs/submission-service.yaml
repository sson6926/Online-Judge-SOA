openapi: 3.0.3
info:
  title: Submission Service API
  description: Tiếp nhận bài nộp và theo dõi trạng thái chấm điểm (Polling Support).
  version: 1.0.0
servers:
  - url: http://localhost:5002
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: submission-service

  /submissions:
    post:
      summary: Nộp mã nguồn (Submit)
      description: Nhận mã nguồn, lưu PENDING và đẩy vào Job Queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: Yêu cầu nộp bài được chấp nhận và đang xếp hàng chấm điểm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: Bad Request

  /submissions/{id}:
    get:
      summary: Lấy kết quả chấm bài (Polling)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trạng thái và kết quả bài nộp hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          description: Không tìm thấy submissionId

components:
  schemas:
    SubmitRequest:
      type: object
      required:
        - problem_id
        - user_id
        - code
        - language
      properties:
        problem_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        code:
          type: string
          example: "print(input())"
        language:
          type: string
          example: python

    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        problem_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        code:
          type: string
        language:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, FINISHED]
          example: PENDING
        verdict:
          type: string
          enum: [AC, WA, TLE, MLE, RTE, CE, SE]
          nullable: true
        time_used:
          type: integer
          nullable: true
          description: Thời gian thực thi (ms)
        memory_used:
          type: integer
          nullable: true
          description: Bộ nhớ tiêu thụ (KB)
        error_details:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
