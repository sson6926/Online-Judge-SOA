openapi: 3.0.3
info:
  title: Submission Service API
  description: Tiếp nhận bài nộp và theo dõi trạng thái chấm điểm (Polling Support).
  version: 1.0.0
servers:
  - url: http://localhost:5002
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      description: Kiểm tra tình trạng hoạt động của dịch vụ nộp bài.
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /submissions:
    post:
      summary: Nộp mã nguồn (Submit)
      description: Nhận mã nguồn, lưu PENDING và đẩy vào Job Queue.
      responses:
        '202':
          description: Yêu cầu nộp bài được chấp nhận và đang xếp hàng chấm điểm
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissionId:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: "Submission accepted and being processed"
        '400':
          description: Bad Request (Lỗi định dạng code, ngôn ngữ không hỗ trợ)

  /submissions/{id}:
    get:
      summary: Lấy kết quả chấm bài (Polling)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trạng thái và kết quả bài nộp hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '404':
          description: Không tìm thấy submissionId

components:
  schemas:
    SubmissionResult:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
        problemId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, FINISHED]
        verdict:
          type: string
          enum: [AC, WA, TLE, MLE, RTE, CE, SE]
          description: |
            AC: Accepted
            WA: Wrong Answer
            TLE: Time Limit Exceeded
            MLE: Memory Limit Exceeded
            RTE: Runtime Error
            CE: Compilation Error
            SE: System Error
        timeMs:
          type: integer
          description: Thời gian thực thi (mili giây)
        memoryKb:
          type: integer
          description: Bộ nhớ tiêu thụ (KB)
        submittedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
          description: Chi tiết lỗi (nếu có - e.g compiler output)
