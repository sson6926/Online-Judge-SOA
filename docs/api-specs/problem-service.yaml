openapi: 3.0.3
info:
  title: Problem Service API
  description: Quản lý bài toán và các bộ testcases cho hệ thống Online Judge.
  version: 1.0.0
servers:
  - url: http://localhost:5001
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: problem-service

  /problems:
    get:
      summary: Lấy danh sách bài toán
      responses:
        '200':
          description: Danh sách bài toán
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Problem'

  /problems/{id}:
    get:
      summary: Lấy chi tiết một bài toán
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết bài toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy bài toán

  /problems/internal/{id}/testcases:
    get:
      summary: "| INTERNAL | Lấy danh sách testcases cho Judge Worker"
      description: Chỉ cho phép các dịch vụ nội bộ truy cập
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Danh sách testcases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestCase'

components:
  schemas:
    Problem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Two Sum
        description:
          type: string
        time_limit:
          type: integer
          example: 1000
        memory_limit:
          type: integer
          example: 256
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]

    TestCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        problem_id:
          type: string
          format: uuid
        input_url:
          type: string
          example: http://minio:9000/testcases/in_1.txt
        output_url:
          type: string
          example: http://minio:9000/testcases/out_1.txt
        created_at:
          type: string
          format: date-time
