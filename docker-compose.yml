# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network

  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery:8761/eureka
    depends_on:
      - problem-service
      - submission-service
      - user-service
      - discovery
      - redis
    networks:
      - app-network

  # ─── Service Discovery (Eureka Server) ───────────
  discovery:
    build: ./discovery
    ports:
      - "8761:8761"
    networks:
      - app-network

  # ─── User Service ────────────────────────────────
  user-service:
    build: ./services/user-service
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db-user
      - discovery
    networks:
      - app-network

  # ─── Problem Service ──────────────────────────────
  problem-service:
    build: ./services/problem-service
    ports:
      - "${PROBLEM_SERVICE_PORT:-5001}:5001"
    env_file:
      - .env
    depends_on:
      - db-problem
      - discovery
      - minio
    networks:
      - app-network

  # ─── Submission Service ───────────────────────────
  submission-service:
    build: ./services/submission-service
    ports:
      - "${SUBMISSION_SERVICE_PORT:-5002}:5002"
    env_file:
      - .env
    depends_on:
      - db-submission
      - rabbitmq
      - redis
      - discovery
    networks:
      - app-network

  # ─── Databases ───────────────────────────────────
  db-user:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-user-data:/var/lib/postgresql/data
    networks:
      - app-network

  db-problem:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${PROBLEM_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-problem-data:/var/lib/postgresql/data
    networks:
      - app-network

  db-submission:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${SUBMISSION_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-submission-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─── MinIO (Object Storage) ──────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # ─── Judge Sandbox Image (build-only, no running container) ─────────────────
  judge-sandbox:
    build:
      context: ./services/judge-service/sandbox
      dockerfile: Dockerfile
    image: judge-sandbox:latest
    # This service exists only to build and tag the sandbox image.
    # judge-service spawns it via `docker run` for each submission.
    profiles:
      - build-sandbox

  # ─── Judge Service ────────────────────────────────
  judge-service:
    build: ./services/judge-service
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      JUDGE_TESTCASES_SOURCE: ${JUDGE_TESTCASES_SOURCE:-problem}
      PROBLEM_SERVICE_URL: http://problem-service:5001
      JUDGE_WORKSPACE_HOST_ROOT: /tmp/judge-jobs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/judge-jobs:/tmp/judge-jobs
    depends_on:
      - rabbitmq
      - problem-service
      - discovery
    networks:
      - app-network

  # ─── Observability ───────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - app-network

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_USER:-guest}
      RABBIT_PASSWORD: ${RABBITMQ_PASS:-guest}
      PUBLISH_PORT: "9419"
    ports:
      - "9419:9419"
    depends_on:
      - rabbitmq
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    networks:
      - app-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - app-network

  # ─── Infrastructure ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-user-data:
  db-problem-data:
  db-submission-data:
  minio-data:
  judge-workspaces:
  loki-data:
  grafana-data:
