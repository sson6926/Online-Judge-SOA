# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Frontend ────────────────────────────────────
#  frontend:
#    build: ./frontend
#    ports:
#      - "${FRONTEND_PORT:-3000}:3000"
#    depends_on:
#      - gateway
#    networks:
#      - app-network

  # ─── API Gateway ─────────────────────────────────
  # gateway:
  #   build: ./gateway
  #   ports:
  #     - "${GATEWAY_PORT:-8080}:8000"
  #   depends_on:
  #     - problem-service
  #     - submission-service
  #     - discovery
  #   networks:
  #     - app-network

  # ─── Service Discovery (Eureka Server) ───────────
  discovery:
    build: ./discovery
    ports:
      - "8761:8761"
    networks:
      - app-network

  # ─── Problem Service ──────────────────────────────
  problem-service:
    build: ./services/problem-service
    ports:
      - "${PROBLEM_SERVICE_PORT:-5001}:5001"
    env_file:
      - .env
    depends_on:
      - db-problem
      - discovery
      - minio
    networks:
      - app-network

  # ─── Submission Service ───────────────────────────
  submission-service:
    build: ./services/submission-service
    ports:
      - "${SUBMISSION_SERVICE_PORT:-5002}:5002"
    env_file:
      - .env
    depends_on:
      - db-submission
      - rabbitmq
      - redis
      - discovery
    networks:
      - app-network

  # ─── Databases ───────────────────────────────────
  db-problem:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${PROBLEM_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-problem-data:/var/lib/postgresql/data
    networks:
      - app-network

  db-submission:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${SUBMISSION_DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-submission-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ─── MinIO (Object Storage) ──────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # ─── Infrastructure ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-problem-data:
  db-submission-data:
  minio-data:
